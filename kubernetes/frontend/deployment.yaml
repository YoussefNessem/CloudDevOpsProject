apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ivolve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ivolve-frontend:latest
          ports:
            - containerPort: 3000

          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ivolve-config
                  key: AUTH_SERVICE_URL

            - name: ROADMAP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ivolve-config
                  key: ROADMAP_SERVICE_URL

            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ivolve-secret
                  key: SESSION_SECRET
