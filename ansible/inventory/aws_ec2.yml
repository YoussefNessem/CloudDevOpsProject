plugin: amazon.aws.aws_ec2

regions:
  - eu-north-1

filters:
  instance-state-name: running
  tag:Role: Jenkins

hostnames:
  - ip-address

compose:
  ansible_host: public_ip_address
  ansible_user: "'ec2-user'"
  ansible_ssh_private_key_file: "'/home/youssef/.ssh/ivolve-key'"

keyed_groups:
  - key: tags.Role
    prefix: role
